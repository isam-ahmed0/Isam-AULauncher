version: 2.1

jobs:
  # --- 1. UBUNTU BUILD JOB ---
  build-ubuntu:
    docker:
      - image: ubuntu:22.04
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: |
            apt-get update && apt-get install -y --no-install-recommends \
              libegl1 libgl1 libgl1-mesa-dev libglvnd0 fontconfig libfontconfig1 \
              libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libxcb1 libx11-6 \
              libxext6 libxrender1 libxi6 libsm6 libice6 libxrandr2 libxcursor1 \
              libxfixes3 libxdamage1 libxcomposite1 libdbus-1-3 binutils python3-pip python3-venv
            python3 -m pip install --upgrade pip --break-system-packages
            python3 -m pip install -r src/launcher/requirements.txt pyinstaller pillow --break-system-packages
      - run:
          name: Build Ubuntu Packages
          command: |
            export VERSION="${CIRCLE_TAG:-1.0.0}"
            python3 build/set_version.py "$VERSION"
            bash build/ci/ubuntu_build.sh
      - persistence/persist_to_workspace:
          root: dist/packages
          paths:
            - CrewLauncher.deb
            - CrewLauncher-Linux.tar.gz

  # --- 2. ARCH LINUX BUILD JOB (via Docker) ---
  build-arch:
    machine: true # Uses machine executor to support Docker-in-Docker natively
    steps:
      - checkout
      - run:
          name: Build Arch Package inside Docker
          command: |
            export VERSION="${CIRCLE_TAG:-1.0.0}"
            python3 build/set_version.py "$VERSION" || true
            docker run --rm -v "$(pwd):/work" -w /work archlinux:latest bash /work/build/ci/arch_build.sh
      - persist_to_workspace:
          root: dist/packages
          paths:
            - CrewLauncher.pkg.tar.zst

  # --- 3. FEDORA BUILD JOB (via Docker) ---
  build-fedora:
    machine: true
    steps:
      - checkout
      - run:
          name: Build Fedora RPM inside Docker
          command: |
            export VERSION="${CIRCLE_TAG:-1.0.0}"
            python3 build/set_version.py "$VERSION" || true
            docker run --rm -v "$(pwd):/work" -w /work fedora:latest bash /work/build/ci/fedora_build.sh
      - persist_to_workspace:
          root: dist/packages
          paths:
            - CrewLauncher.rpm

workflows:
  version: 2
  build-and-release:
    jobs:
      - build-ubuntu:
          filters:
            tags:
              only: /.*/
      - build-arch:
          filters:
            tags:
              only: /.*/
      - build-fedora:
          filters:
            tags:
              only: /.*/