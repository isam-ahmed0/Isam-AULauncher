# Ruff configuration — https://docs.astral.sh/ruff/configuration/
#
# Lint-only setup: the codebase is deliberately not auto-formatted.
# Run:  ruff check src/launcher
#
# Selected rules: pycodestyle errors (E4/E7/E9) + pyflakes (F).
# Line-length and import-sorting rules are intentionally left out to keep
# the working code untouched.

target-version = "py310"
line-length = 100

# archive/ is historical code kept for reference (see archive/README.md).
# build/ and dist/ are excluded by Ruff's defaults already.
exclude = ["archive"]

[lint]
select = ["E4", "E7", "E9", "F"]
