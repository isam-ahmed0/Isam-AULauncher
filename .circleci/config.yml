version: 2.1

# Automatic runs: push a version tag (1.0, 1.0-beta.2, 0.7.3, ...).
# Manual runs: trigger a pipeline on a branch with build_manually=true, e.g.
#   curl -X POST -H "Circle-Token: $CIRCLECI_TOKEN" -H "Content-Type: application/json" \
#     -d '{"branch":"crew","parameters":{"build_manually":true,"version":"1.0-beta.4"}}' \
#     https://circleci.com/api/v2/project/gh/isam-ahmed0/Isam-AULauncher/pipeline
# (The web UI "Trigger Pipeline" button also works.)

parameters:
  version:
    type: string
    default: ""
    description: "Optional version to embed (blank = use CIRCLE_TAG or src/launcher/config.py)."
  build_manually:
    type: boolean
    default: false
    description: "Set true to run the manual workflow (used for non-tag builds/releases)."

executors:
  ubuntu:
    docker:
      # Official image is built with --enable-shared, so PyInstaller can always
      # find libpython. Ships git/curl/openssh-client (buildpack-deps base).
      - image: python:3.11
  linux-machine:
    machine:
      image: ubuntu-2204:current
  release:
    docker:
      - image: cimg/base:stable

commands:
  resolve-version:
    description: "Determine the version to embed and export it as VERSION for later steps."
    steps:
      - run:
          name: Resolve version
          command: |
            set -euo pipefail
            VERSION="<< pipeline.parameters.version >>"
            if [ -z "$VERSION" ] && [ -n "${CIRCLE_TAG:-}" ]; then
              VERSION="${CIRCLE_TAG#v}"
            fi
            if [ -z "$VERSION" ]; then
              VERSION="$(grep -oP '^LAUNCHER_VERSION\s*=\s*"\K[^"]+' src/launcher/config.py || true)"
            fi
            if [ -z "$VERSION" ]; then
              echo "ERROR: could not determine version (no parameter, tag, or config.py value)" >&2
              exit 1
            fi
            echo "export VERSION='$VERSION'" >> "$BASH_ENV"
            echo "Resolved version: $VERSION"

jobs:
  build-ubuntu:
    executor: ubuntu
    steps:
      - checkout

      - restore_cache:
          keys:
            - pip-ubuntu-v2-{{ checksum "src/launcher/requirements.txt" }}
            - pip-ubuntu-v2-

      - run:
          name: Install system dependencies
          command: |
            apt-get update
            apt-get install -y --no-install-recommends \
              libegl1 libgl1 libgl1-mesa-dev libglvnd0 fontconfig libfontconfig1 \
              libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libxcb1 \
              libx11-6 libxext6 libxrender1 libxi6 libsm6 libice6 \
              libxrandr2 libxcursor1 libxfixes3 libxdamage1 libxcomposite1 \
              libdbus-1-3 binutils

      - run:
          name: Install Python dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r src/launcher/requirements.txt pyinstaller pillow customtkinter

      - save_cache:
          key: pip-ubuntu-v2-{{ checksum "src/launcher/requirements.txt" }}
          paths:
            - ~/.cache/pip

      - resolve-version
      - run:
          name: Patch embedded version
          command: python build/set_version.py "$VERSION"
      - run:
          name: Build + package (Ubuntu)
          command: bash build/ci/ubuntu_build.sh

      - store_artifacts:
          path: dist/packages
      - persist_to_workspace:
          root: dist/packages
          paths:
            - CrewLauncher.deb
            - CrewLauncher-Linux.tar.gz

  build-arch:
    executor: linux-machine
    steps:
      - checkout
      - resolve-version
      - run:
          name: Patch embedded version
          command: python3 build/set_version.py "$VERSION"
      - run:
          name: Build + package (Arch container)
          command: |
            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              archlinux:latest \
              bash /work/build/ci/arch_build.sh
      - store_artifacts:
          path: dist/packages
      - persist_to_workspace:
          root: dist/packages
          paths:
            - CrewLauncher.pkg.tar.zst

  build-fedora:
    executor: linux-machine
    steps:
      - checkout
      - resolve-version
      - run:
          name: Patch embedded version
          command: python3 build/set_version.py "$VERSION"
      - run:
          name: Build + package (Fedora container)
          command: |
            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              fedora:latest \
              bash /work/build/ci/fedora_build.sh
      - store_artifacts:
          path: dist/packages
      - persist_to_workspace:
          root: dist/packages
          paths:
            - CrewLauncher.rpm

  release:
    executor: release
    steps:
      - attach_workspace:
          at: /tmp/packages
      - store_artifacts:
          path: /tmp/packages
      - run:
          name: Publish Linux packages to GitHub release
          command: |
            set -euo pipefail
            : "${GITHUB_TOKEN:?set GITHUB_TOKEN in CircleCI project environment variables}"
            TAG="${CIRCLE_TAG:-<< pipeline.parameters.version >>}"
            if [ -z "$TAG" ]; then
              echo "No tag or version parameter; nothing to publish" >&2
              exit 1
            fi
            API="https://api.github.com/repos/isam-ahmed0/Isam-AULauncher"
            UPLOADS="https://uploads.github.com/repos/isam-ahmed0/Isam-AULauncher"
            AUTH="Authorization: Bearer ${GITHUB_TOKEN}"

            REL_ID="$(curl -fsS -H "$AUTH" "$API/releases/tags/$TAG" 2>/dev/null \
              | grep -oP '"id":\s*[0-9]+' | head -1 | grep -oP '[0-9]+' || true)"
            if [ -z "$REL_ID" ]; then
              REL_ID="$(curl -fsS -X POST -H "$AUTH" -H "Content-Type: application/json" \
                -d "{\"tag_name\":\"$TAG\",\"name\":\"CrewLauncher $TAG\",\"generate_release_notes\":true}" \
                "$API/releases" | grep -oP '"id":\s*[0-9]+' | head -1 | grep -oP '[0-9]+')"
            fi
            echo "Release id: $REL_ID"

            EXISTING="$(curl -fsS -H "$AUTH" "$API/releases/$REL_ID/assets" 2>/dev/null || echo '[]')"
            for f in /tmp/packages/*; do
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              # Delete any same-named asset so re-runs of the job are idempotent.
              aid="$(printf '%s' "$EXISTING" | grep -oP '\{[^{}]*\}' \
                | grep -F "\"name\": \"$name\"" | grep -oP '"id":\s*\K[0-9]+' | head -1 || true)"
              if [ -n "$aid" ]; then
                echo "Replacing existing asset $name (id $aid)"
                curl -fsS -X DELETE -H "$AUTH" "$API/releases/assets/$aid" > /dev/null
              fi
              echo "Uploading $name"
              # Asset uploads must go to uploads.github.com, not api.github.com.
              curl -fsS -X POST -H "$AUTH" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$f" \
                "$UPLOADS/releases/$REL_ID/assets?name=$name" > /dev/null
            done
            echo "Done."

workflows:
  build-and-release:
    jobs:
      - build-ubuntu:
          filters: &tag-only
            tags:
              only: /^\d+\.\d+.*/
            branches:
              ignore: /.*/
      - build-arch:
          filters: *tag-only
      - build-fedora:
          filters: *tag-only
      - release:
          requires:
            - build-ubuntu
            - build-arch
            - build-fedora
          filters: *tag-only

  # Runs only when manually triggered with build_manually=true, so pushes to
  # the default branch cost no build minutes. Uses the branch HEAD config.
  manual:
    when: << pipeline.parameters.build_manually >>
    jobs:
      - build-ubuntu
      - build-arch
      - build-fedora
      - release:
          requires:
            - build-ubuntu
            - build-arch
            - build-fedora
