name: Build (Linux)

on:
  workflow_call:
    inputs:
      version:
        description: "Version to embed. Blank = keep src/launcher/config.py"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Version to embed. Blank = keep src/launcher/config.py"
        required: false
        default: ""

jobs:
  arch:
    name: Arch Linux (pkg.tar.zst)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            v="$(grep -oP '^LAUNCHER_VERSION\s*=\s*"\K[^"]+' src/launcher/config.py || true)"
          fi
          if [ -z "$v" ]; then
            echo "ERROR: could not determine version" >&2
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Version: $v"

      - name: Patch embedded version
        run: python3 build/set_version.py "$VERSION"

      - name: Build + package (Arch container)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            archlinux:latest \
            bash /work/build/ci/arch_build.sh

      - name: Show packages
        run: ls -lh dist/packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          if-no-files-found: error
          path: dist/packages/CrewLauncher.pkg.tar.zst

  ubuntu:
    name: Ubuntu (deb + portable tarball)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            v="$(grep -oP '^LAUNCHER_VERSION\s*=\s*"\K[^"]+' src/launcher/config.py || true)"
          fi
          if [ -z "$v" ]; then
            echo "ERROR: could not determine version" >&2
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Version: $v"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libgl1-mesa-dev libglvnd0 fontconfig libfontconfig1 \
            libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libxcb1 \
            libx11-6 libxext6 libxrender1 libxi6 libsm6 libice6 \
            libxrandr2 libxcursor1 libxfixes3 libxdamage1 libxcomposite1 \
            libdbus-1-3 binutils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/launcher/requirements.txt pyinstaller pillow

      - name: Patch embedded version
        run: python3 build/set_version.py "$VERSION"

      - name: Build + package (Ubuntu)
        run: bash build/ci/ubuntu_build.sh

      - name: Show packages
        run: ls -lh dist/packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-ubuntu
          if-no-files-found: error
          path: |
            dist/packages/CrewLauncher.deb
            dist/packages/CrewLauncher-Linux.tar.gz

  fedora:
    name: Fedora / RHEL (rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            v="$(grep -oP '^LAUNCHER_VERSION\s*=\s*"\K[^"]+' src/launcher/config.py || true)"
          fi
          if [ -z "$v" ]; then
            echo "ERROR: could not determine version" >&2
            exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Version: $v"

      - name: Patch embedded version
        run: python3 build/set_version.py "$VERSION"

      - name: Build + package (Fedora container)
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            fedora:latest \
            bash /work/build/ci/fedora_build.sh

      - name: Show packages
        run: ls -lh dist/packages

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-fedora
          if-no-files-found: error
          path: dist/packages/CrewLauncher.rpm
