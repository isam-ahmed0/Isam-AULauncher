name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version / release tag (e.g. 1.0.0). Keep the root LAUNCHER_VERSION file in sync so in-app updates resolve."
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create as draft"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ inputs.version }}

  linux:
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ inputs.version }}

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) \
            -exec cp -v {} release-assets/ \;
          echo "--- release assets ---"
          ls -lh release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: CrewLauncher ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          draft: ${{ inputs.draft }}
          generate_release_notes: true
          files: release-assets/*
