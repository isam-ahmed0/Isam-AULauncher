<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060b12"/>
      <stop offset="0.5" stop-color="#0c1723"/>
      <stop offset="1" stop-color="#15283a"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.16" cy="0.02" r="0.72">
      <stop offset="0" stop-color="#9ec6df" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#6f9fbe" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6f9fbe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drift" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6cedc" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#66879b" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#040a11" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#040a11" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#040a11" stop-opacity="0.44"/>
    </linearGradient>
    <g id="spark">
      <path d="M0-8V8M-8 0H8M-5.7-5.7 5.7 5.7M5.7-5.7-5.7 5.7"
            fill="none" stroke="#dcecf6" stroke-width="1.1" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#haze)"/>

  <g opacity="0.36">
    <use href="#spark" transform="translate(260 150) scale(0.45)"/>
    <use href="#spark" transform="translate(610 92) scale(0.3)"/>
    <use href="#spark" transform="translate(940 208) scale(0.38)"/>
    <use href="#spark" transform="translate(1320 118) scale(0.28)"/>
    <use href="#spark" transform="translate(1660 190) scale(0.42)"/>
    <use href="#spark" transform="translate(410 330) scale(0.26)"/>
    <use href="#spark" transform="translate(1120 360) scale(0.24)"/>
    <use href="#spark" transform="translate(1800 380) scale(0.3)"/>
  </g>

  <path d="M0 700 Q260 650 520 690 T1030 675 T1510 705 T1920 660 V1080 H0 Z"
        fill="#7fa0b5" opacity="0.1"/>
  <path d="M0 790 Q340 725 690 780 T1360 760 T1920 800 V1080 H0 Z"
        fill="#8fb0c4" opacity="0.16"/>
  <path d="M0 890 Q300 840 620 880 T1260 860 T1920 900 V1080 H0 Z"
        fill="url(#drift)"/>

  <g opacity="0.22">
    <use href="#spark" transform="translate(180 940) scale(0.7)"/>
    <use href="#spark" transform="translate(760 970) scale(0.55)"/>
    <use href="#spark" transform="translate(1370 935) scale(0.65)"/>
    <use href="#spark" transform="translate(1810 980) scale(0.5)"/>
  </g>

  <rect width="1920" height="1080" fill="url(#veil)"/>
</svg>
